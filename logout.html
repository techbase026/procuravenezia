<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procura RP | Logout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="logout-page">
  <section class="logout-card">
    <div class="crest">PR</div>
    <p class="eyebrow">Sessione terminata</p>
    <h1>Disconnessione effettuata</h1>
    <p>Hai lasciato l'area riservata della Procura RP. Per motivi di sicurezza la sessione e` stata chiusa.</p>

    <div class="logout-actions">
      <button type="button" onclick="window.location.href='index.html'">Accedi di nuovo</button>
      <button type="button" class="secondary-btn" onclick="window.location.href='index.html'">Torna alla home</button>
    </div>

    <p class="topbar-meta">Reindirizzamento automatico in <span id="logout-countdown">8</span>s</p>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
